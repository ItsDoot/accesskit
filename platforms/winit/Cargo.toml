[package]
name = "accesskit_winit"
version = "0.30.0"
authors.workspace = true
license = "Apache-2.0"
description = "AccessKit UI accessibility infrastructure: winit adapter"
categories.workspace = true
keywords = ["gui", "ui", "accessibility", "winit"]
repository.workspace = true
readme = "README.md"
edition.workspace = true
rust-version.workspace = true

[features]
default = ["accesskit_unix", "async-io", "winit/x11", "winit/wayland"]
async-io = ["accesskit_adapter/async-io"]
tokio = ["accesskit_adapter/tokio"]

[dependencies]
accesskit = { version = "0.22.0", path = "../../common" }
accesskit_adapter = { version = "0.29.2", path = "../adapter" }
winit-core = { git = "https://github.com/rust-windowing/winit", rev = "27e17e3", default-features = false }
raw-window-handle = { version = "0.6.2", features = ["std"] }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = { version = "0.30.0", path = "../windows" }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = { version = "0.23.0", path = "../macos" }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
accesskit_unix = { version = "0.18.0", path = "../unix", optional = true, default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
accesskit_android = { version = "0.5.0", path = "../android", optional = true, features = ["embedded-dex"] }
winit-android = { git = "https://github.com/rust-windowing/winit", rev = "27e17e3" }
android-activity = { version = "0.6.0" }

[dev-dependencies.winit]
version = "0.31.0-beta.2"
default-features = false
features = ["x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dev-dependencies]
softbuffer = { version = "0.4.0", default-features = false, features = [
    "x11",
    "x11-dlopen",
    "wayland",
    "wayland-dlopen",
] }
